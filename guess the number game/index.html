<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guessing Number Game</title>
    <style>
        body{
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: #310431;
            text-align: center;
            color: white;
            background: linear-gradient(to right,#5c135c,#410641);
        }
        #form{
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            font-size: 18px;
            
        }
        .div{
            text-align: center;
        }
        #guess{
            margin: 6px;
        }
        #submit{
            margin: 6px;
            border: 1px sloid black;
            border-radius: 10px;
        }
        .heading{
            font-size: 28px;
            margin-top: 30px;
            margin-bottom: 6px;
        }
        .instruction{
            margin: 15px;
        }
        #rem{
            font-size: 18px;
        }
        #chances{
            font-size: 18px;
            color: white;
        }
        #msg{
            font-size: 16px;
            color: rgb(250, 242, 4);
        }
    </style>
</head>
<body>
    <div class="div">
        <p class="heading">Guess The Number Game</p>
        <p class="instruction">You have 10 chances to guess the number </p>
        <p class="instruction">Best of Luck!</p>
        <form action="" id="form">
            Type Your Number : <input type="number"  name="" id="guess">
            <div><button type="submit" id="submit">check</button></div>

            <div id="msg"></div>
            

        </form>
        <p  id="rem">Remaining chances <div id="chances"></div></p>
        <button type="submit" id="restart">Restart</button></div>
    </div>
    <script src="index.js"></script>
</body>
</html>
